# Added by Codex: 6k fallback QLoRA solver-SFT config for 2x L40S.

model:
  name: Qwen/Qwen3-4B-Thinking-2507
  device_map: auto
  attn_implementation: null

paths:
  train_file: codex_added/solver_sft/data/train.jsonl
  eval_file: codex_added/solver_sft/data/eval.jsonl
  output_dir: codex_added/solver_sft/adapters/solver_sft_lora_6k
  solver_adapter: codex_added/solver_sft/adapters/solver_sft_lora_6k
  answer_finalizer_adapter: codex_added/solver_sft/adapters/answer_finalizer_lora
  test_file: data/private.jsonl
  eval_raw_output: codex_added/solver_sft/results/eval_solver_raw_6k.jsonl
  eval_final_output: codex_added/solver_sft/results/eval_solver_finalized_6k.jsonl
  submission_jsonl: codex_added/solver_sft/results/solver_sft_submission_6k.jsonl
  submission_csv: codex_added/solver_sft/submissions/solver_sft_submission_6k.csv

data:
  output_dir: codex_added/solver_sft/data
  train_file: codex_added/solver_sft/data/train.jsonl
  eval_file: codex_added/solver_sft/data/eval.jsonl
  metamath_count: 20000
  mathinstruct_count: 7500
  openmath_count: 7500
  self_count: 10000
  competition_count: 5000
  metamath_dataset: meta-math/MetaMathQA
  mathinstruct_dataset: TIGER-Lab/MathInstruct
  openmath_dataset: nvidia/OpenMathInstruct-2
  metamath_split: train
  mathinstruct_split: train
  openmath_split: train
  self_traces:
    - codex_added/solver_sft/data/self_generated_correct.jsonl
  competition_jsonl:
    - data/public.jsonl
  eval_size: 1000
  seed: 151
  streaming: true
  max_scan_multiplier: 25
  min_reasoning_chars: 80
  max_problem_chars: 12000
  max_answer_chars: 400
  max_reasoning_chars: 24000
  truncate_long_reasoning: true

training:
  max_seq_length: 6144
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  num_train_epochs: 1
  learning_rate: 1.0e-4
  warmup_ratio: 0.03
  weight_decay: 0.0
  optim: paged_adamw_8bit
  bf16: true
  tf32: true
  gradient_checkpointing: true
  use_4bit: true
  packing: false
  logging_steps: 10
  save_steps: 500
  eval_steps: null
  keep_last_n_checkpoints: 3
  seed: 151
  report_to: []

lora:
  rank: 32
  alpha: 64
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

generation:
  variant: final_box_only
  max_new_tokens: 8192
  max_input_tokens: 4096
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  batch_size: 1

finalizer:
  enabled: true
  max_trace_chars: 6000
  max_input_tokens: 4096
  max_new_tokens: 64
  temperature: 0.1
  top_p: 0.9
  retry_bad_format: true
  retry_max_new_tokens: 128

evaluation:
  data_file: codex_added/job_data/public_stratified_40.jsonl
  offset: 0
  limit: null
  use_4bit: false
  bf16: true

submission:
  id_column: id
  answer_column: answer
  offset: 0
  limit: null
  use_4bit: false
  bf16: true
