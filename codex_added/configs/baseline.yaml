# Added by Codex: baseline CLI configuration; not part of the original starter repository.
model:
  id: Qwen/Qwen3-4B-Thinking-2507
  backend: vllm
  trust_remote_code: true
  quantization: none
  torch_dtype: float16
  device_map: auto
  max_input_tokens: 4096

generation:
  max_new_tokens: 2048
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  repetition_penalty: 1.0
  do_sample: true
  batch_size: 16

vllm:
  dtype: float16
  quantization: null
  load_format: auto
  gpu_memory_utilization: 0.90
  tensor_parallel_size: 1
  max_model_len: 6144
  max_num_seqs: 16
  max_num_batched_tokens: 8192
  enable_prefix_caching: true

paths:
  public_data: data/public.jsonl
  private_data: data/private.jsonl
  results: codex_added/results/baseline_results.jsonl
  submission: codex_added/submissions/baseline_submission.csv

prompt:
  math_system: >
    You are an expert mathematician. Solve the problem step-by-step.
    Put your final answer inside \boxed{}.
    If the problem has multiple sub-answers, separate them by commas inside
    a single \boxed{}, e.g. \boxed{3, 7}.
  mcq_system: >
    You are an expert mathematician. Read the problem and answer choices,
    then select the single best answer. Put only the final option letter
    inside \boxed{}, e.g. \boxed{C}.
