apiVersion: batch/v1
kind: Job
metadata:
  name: wenhao-public200-8k-4gpu
  namespace: ai-md
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: wenhao-public200-8k-4gpu
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-A10
                      - NVIDIA-A40
                      - NVIDIA-L4
                      - NVIDIA-L40
                      - NVIDIA-L40S
                      - NVIDIA-GeForce-RTX-3090
                      - NVIDIA-GeForce-RTX-4090
                      - NVIDIA-RTX-A5000
                      - NVIDIA-RTX-A6000
                      - NVIDIA-RTX-5000-Ada-Generation
                      - NVIDIA-TITAN-RTX
                      - Quadro-RTX-6000
                      - Quadro-RTX-8000
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: PreferNoSchedule
      containers:
        - name: public200-8k
          image: ncking/bige:latest
          imagePullPolicy: Always
          workingDir: /home/mnt/BiomechAI/Wenhao/archive2/CSE151B-Chungers-wenhao-lfs
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONNOUSERSITE
              value: "1"
            - name: RUN_SMOKE
              value: "1"
            - name: DATA_PATH
              value: data/public.jsonl
            - name: ROW_OFFSET
              value: "0"
            - name: ROW_LIMIT
              value: "200"
            - name: GPUS
              value: "0,1,2,3"
            - name: EXPECTED_GPUS
              value: "4"
            - name: MIN_GPU_MEM_MIB
              value: "22000"
            - name: MAX_NEW_TOKENS
              value: "8192"
            - name: REASON_MAX_MODEL_LEN
              value: "10240"
            - name: REASON_GPU_UTIL
              value: "0.90"
            - name: REASON_MAX_NUM_SEQS
              value: "1"
            - name: REASON_MAX_NUM_BATCHED_TOKENS
              value: "10240"
            - name: FINAL_MAX_MODEL_LEN
              value: "6144"
            - name: FINAL_GPU_UTIL
              value: "0.90"
            - name: FINAL_MAX_NUM_SEQS
              value: "2"
            - name: FINAL_MAX_NUM_BATCHED_TOKENS
              value: "6144"
            - name: FINAL_VLLM_BATCH_SIZE
              value: "8"
            - name: FINAL_MAX_INPUT_TOKENS
              value: "4096"
            - name: FINAL_MAX_NEW_TOKENS
              value: "64"
            - name: FINAL_RETRY_MAX_NEW_TOKENS
              value: "128"
            - name: HF_HOME
              value: /home/mnt/BiomechAI/Wenhao/archive2/CSE151B-Chungers-wenhao-lfs/.hf-cache
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: TOKENIZERS_PARALLELISM
              value: "false"
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: expandable_segments:True,max_split_size_mb:256
            - name: CUDA_MODULE_LOADING
              value: LAZY
          command:
            - /bin/bash
            - -lc
          args:
            - |
              set -euo pipefail
              if command -v conda >/dev/null 2>&1; then
                eval "$(conda shell.bash hook)"
                set +u
                conda activate BIGE || conda activate base
                set -u
              fi
              cd /home/mnt/BiomechAI/Wenhao/archive2/CSE151B-Chungers-wenhao-lfs
              bash codex_added/scripts/29_run_public200_8k_finalized_4gpu.sh
          resources:
            requests:
              cpu: "32"
              memory: 256Gi
              nvidia.com/gpu: "4"
            limits:
              cpu: "32"
              memory: 256Gi
              nvidia.com/gpu: "4"
          volumeMounts:
            - name: biomech-ai
              mountPath: /home/mnt
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: biomech-ai
          persistentVolumeClaim:
            claimName: biomech-ai
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 128Gi
