apiVersion: batch/v1
kind: Job
metadata:
  name: cse151b-best-merge
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: cse151b-best-2x4gpu
        shard-job: merge
    spec:
      restartPolicy: Never
      containers:
      - name: cse151b-best-merge
        image: ncking/bige:latest
        imagePullPolicy: Always
        workingDir: /home/mnt/BiomechAI/Wenhao/151B_SP26_Competition
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: CSE151B_ROOT
          value: /home/mnt/BiomechAI/Wenhao/151B_SP26_Competition
        - name: DATA_PATH
          value: data/private.jsonl
        - name: JOB0_SELECTED
          value: codex_added/results/best_private_job0/selected.jsonl
        - name: JOB1_SELECTED
          value: codex_added/results/best_private_job1/selected.jsonl
        - name: MERGED_SELECTED
          value: codex_added/results/best_private_merged/selected.jsonl
        - name: SUBMISSION_PATH
          value: codex_added/submissions/best_submission.csv
        - name: WAIT_SECONDS
          value: "86400"
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -eo pipefail
          if command -v conda >/dev/null 2>&1; then
            eval "$(conda shell.bash hook)"
            set +u
            conda activate BIGE || conda activate base
            set -u
          fi

          cd "${CSE151B_ROOT}"

          waited=0
          while [[ ! -f "${JOB0_SELECTED}" || ! -f "${JOB1_SELECTED}" ]]; do
            if [[ "${waited}" -ge "${WAIT_SECONDS}" ]]; then
              echo "Timed out waiting for shard outputs." >&2
              echo "job0=${JOB0_SELECTED}"
              echo "job1=${JOB1_SELECTED}"
              exit 1
            fi
            echo "Waiting for shard outputs: waited=${waited}s"
            sleep 60
            waited=$((waited + 60))
          done

          python codex_added/scripts/21_merge_shard_predictions.py \
            --data "${DATA_PATH}" \
            --output "${MERGED_SELECTED}" \
            --predictions "${JOB0_SELECTED}" "${JOB1_SELECTED}"

          python codex_added/scripts/make_submission.py \
            --data "${DATA_PATH}" \
            --predictions "${MERGED_SELECTED}" \
            --output "${SUBMISSION_PATH}"

          {
            echo "job=cse151b-best-merge"
            echo "data_path=${DATA_PATH}"
            echo "job0_selected=${JOB0_SELECTED}"
            echo "job1_selected=${JOB1_SELECTED}"
            echo "merged_selected=${MERGED_SELECTED}"
            echo "submission_path=${SUBMISSION_PATH}"
            echo "completed_at=$(date -Iseconds)"
          } > "$(dirname "${MERGED_SELECTED}")/K8S_RUN_INFO.txt"

          echo "Done. Submission is at ${SUBMISSION_PATH}"
        resources:
          limits:
            memory: 32Gi
            cpu: "8"
          requests:
            memory: 16Gi
            cpu: "4"
        volumeMounts:
        - name: biomech-ai
          mountPath: /home/mnt
        - name: biomech-ai
          mountPath: /mnt
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: biomech-ai
        persistentVolumeClaim:
          claimName: biomech-ai
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
